apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrations-app
  namespace: integrations
  labels:
    project: integrations
    service: integrations
    type: app
spec:
  replicas: 2
  selector:
    matchLabels:
      project: integrations
      service: integrations
      type: app
  template:
    metadata:
      labels:
        project: integrations
        service: integrations
        type: app
    spec:
      automountServiceAccountToken: false
      containers:
        - name: integrations-app
          image: a2odev/integrations:latest
          resources:
            requests:
              memory: '250Mi'
              cpu: '0.25'
            limits:
              memory: '500Mi'
              cpu: '0.5'
          envFrom:
            - secretRef:
                name: integrations
            - secretRef:
                name: shared
          ports:
            - containerPort: 3000
